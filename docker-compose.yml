services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: synrgy
      POSTGRES_PASSWORD: synrgy
      POSTGRES_DB: synrgy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synrgy"]
      interval: 2s
      retries: 20

  # The production image, for trying it locally:  docker compose --profile app up --build
  # Then open http://localhost:8080. (Plain HTTP here; in production put TLS in front and drop HTTPS=false.)
  app:
    profiles: [app]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://synrgy:synrgy@db:5432/synrgy
      CLIENT_ORIGIN: http://localhost:8080
      HTTPS: "false"
      MAIL_PROVIDER: console
    ports:
      - "8080:4000"
    restart: unless-stopped

volumes:
  pgdata:
